<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <title>SmartQuiz Pro - Генератор</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        textarea#userInput { width: 100%; height: 150px; margin-bottom: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: vertical; box-sizing: border-box; }
        button.main-btn { background: #007bff; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .question-block { margin-bottom: 25px; padding: 20px; background: #fff; border: 1px solid #eee; border-radius: 10px; border-left: 6px solid #007bff; }
        input[type="text"], textarea.answer-box { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        textarea.answer-box { height: 100px; resize: none; }
        .check-btn { background: #28a745; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; }
        .feedback { margin-top: 12px; font-size: 0.95em; line-height: 1.4; }
        .correct { color: #28a745; font-weight: bold; }
        .wrong { color: #dc3545; font-weight: bold; }
        .partial { color: #fd7e14; font-weight: bold; }
        label { display: block; margin: 10px 0; cursor: pointer; padding: 5px; border-radius: 4px; transition: 0.2s; }
        label:hover { background: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h2>SmartQuiz Pro</h2>
    <textarea id="userInput" placeholder="Внеси го текстот за учење тука..."></textarea>
    <button class="main-btn" onclick="generateQuiz()">ГЕНЕРИРАЈ ТЕСТ</button>

    <div id="quizResult" style="margin-top: 30px;"></div>
    <div id="scoreArea" style="text-align: center; margin-top: 20px;"></div>
</div>

<script>
    let currentQuestions = [];

    async function generateQuiz() {
        const text = document.getElementById('userInput').value;
        const resultDiv = document.getElementById('quizResult');
        
        if (!text || text.length < 20) {
            alert("Внеси подолг текст за да генерираме прашања!");
            return;
        }

        resultDiv.innerHTML = "<p style='text-align:center;'>Се подготвуваат прашањата...</p>";

        try {
            const response = await fetch('http://127.0.0.1:5000/generate-quiz', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const data = await response.json();
            currentQuestions = data.quiz;
            displayQuiz();
        } catch (error) {
            resultDiv.innerHTML = "<p class='wrong'>Грешка: Провери дали Python серверот е вклучен!</p>";
        }
    }

    function displayQuiz() {
        const resultDiv = document.getElementById('quizResult');
        resultDiv.innerHTML = "";
        
        currentQuestions.forEach((q, index) => {
            let html = `<div class="question-block">`;
            html += `<p><strong>${index + 1}. ${q.question}</strong></p>`;
            
            if (q.type === 'choice') {
                q.options.forEach(opt => {
                    html += `<label><input type="radio" name="q${index}" value="${opt}"> ${opt}</label>`;
                });
            } else if (q.type === 'multiple_choice') {
                q.options.forEach(opt => {
                    html += `<label><input type="checkbox" name="q${index}" value="${opt}"> ${opt}</label>`;
                });
            } else if (q.type === 'essay') {
                html += `<textarea id="ans${index}" class="answer-box" placeholder="Раскажи со свои зборови..."></textarea>`;
            } else {
                html += `<input type="text" id="ans${index}" placeholder="Напиши го одговорот...">`;
            }
            
            html += `<div id="fb${index}" class="feedback"></div>`;
            html += `</div>`;
            resultDiv.innerHTML += html;
        });

        if (currentQuestions.length > 0) {
            resultDiv.innerHTML += `<button class="check-btn" onclick="checkAnswers()">ПРОВЕРИ ОДГОВОРИ</button>`;
        }
    }

    function checkAnswers() {
        let score = 0;
        currentQuestions.forEach((q, i) => {
            const fb = document.getElementById(`fb${i}`);
            let isCorrect = false;
            let statusMessage = "";

            if (q.type === 'multiple_choice') {
                const checked = Array.from(document.querySelectorAll(`input[name="q${i}"]:checked`)).map(el => el.value.toLowerCase().trim());
                const correct = q.correct_answer.map(a => a.toLowerCase().trim());
                isCorrect = correct.every(a => checked.includes(a)) && checked.length === correct.length;
            } 
            else if (q.type === 'choice') {
                const sel = document.querySelector(`input[name="q${i}"]:checked`);
                isCorrect = sel && sel.value.toLowerCase().trim() === q.correct_answer.toLowerCase().trim();
            } 
            else if (q.type === 'essay') {
                const userVal = document.getElementById(`ans${i}`).value.toLowerCase().trim();
                const keywords = q.keywords || [];
                let matchCount = 0;
                
                keywords.forEach(word => { if (userVal.includes(word)) matchCount++; });
                let percent = (matchCount / keywords.length) * 100;
                
                if (percent >= 60) {
                    isCorrect = true;
                    statusMessage = `<span class="partial">(Делумно точно - ${Math.round(percent)}% клучни поими)</span>`;
                } else {
                    statusMessage = `<span class="wrong">(Недоволно поими - само ${Math.round(percent)}%)</span>`;
                }
            } 
            else {
                const userVal = document.getElementById(`ans${i}`).value.trim().toLowerCase();
                isCorrect = userVal === q.correct_answer.toLowerCase().trim();
            }

            if (isCorrect) {
                score++;
                fb.innerHTML = `<span class="correct">✓ Точно!</span> ${statusMessage}`;
            } else {
                let show = Array.isArray(q.correct_answer) ? q.correct_answer.join(", ") : q.correct_answer;
                fb.innerHTML = `<span class="wrong">✗ Погрешно.</span> ${statusMessage}<br>Точно: <em>${show}</em>`;
            }
        });

        document.getElementById('scoreArea').innerHTML = `<h3>Резултат: ${score} / ${currentQuestions.length}</h3>`;
    }
</script>

</body>
</html>
